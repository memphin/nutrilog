# XcodeGen spec — source of truth for Vitalion.xcodeproj.
# After editing: `xcodegen generate` (brew install xcodegen), then commit both files.
name: Vitalion
options:
  bundleIdPrefix: hr.ivanjuric
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Local builds only: the TestFlight job overrides both from the tag (v0.2.0 → 0.2.0) and the commit count.
    # Keep MARKETING_VERSION at the version being released next (docs/RELEASING.md).
    MARKETING_VERSION: "1.1.7"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Localization (FR-74): English source, Croatian translation, in String Catalogs (.xcstrings) next to the code.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  Core: { path: Packages/Core }
  Persistence: { path: Packages/Persistence }
  FoodSources: { path: Packages/FoodSources }
  FoodLookup: { path: Packages/FoodLookup }
  HealthKitClient: { path: Packages/HealthKitClient }
  Scanner: { path: Packages/Scanner }
  DesignSystem: { path: Packages/DesignSystem }
targets:
  Vitalion:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
      - Shared
      - path: Resources/FoodIndex
        buildPhase: resources
        type: folder
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        # Bundle IDs and the App Group keep the former name (Nutrilog): a new ID would be a new app to Apple, without
        # the installed data, Health permissions or TestFlight history.
        PRODUCT_BUNDLE_IDENTIFIER: hr.ivanjuric.nutrilog
        PRODUCT_NAME: Vitalion
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Vitalion
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        USDAFDCAPIKey: $(USDA_FDC_API_KEY)
        OFFUserAgentContact: $(OFF_USER_AGENT_CONTACT)
        NSHealthShareUsageDescription: Vitalion reads your weight, body fat, steps, sleep, energy, heart rate and water from Apple Health to show them next to what you eat.
        NSHealthUpdateUsageDescription: Vitalion writes the nutrients and water you log, and the weight and body fat you enter manually, to Apple Health.
        NSCameraUsageDescription: Vitalion uses the camera to scan product barcodes and to take a photo of a meal to estimate what it contains.
    entitlements:
      path: App/Vitalion.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        # Shared with the widget extension: the app writes today's snapshot there (backlog #42).
        com.apple.security.application-groups: [group.hr.ivanjuric.nutrilog]
    dependencies:
      - package: Core
      - package: Persistence
      - package: FoodSources
      - package: FoodLookup
      - package: HealthKitClient
      - package: Scanner
      - package: DesignSystem
      - target: VitalionWidgets
  # Home Screen / Lock Screen widgets (FR-70). Reads only the snapshot in the App Group container: no packages, no database.
  VitalionWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hr.ivanjuric.nutrilog.widgets
        PRODUCT_NAME: VitalionWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Vitalion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/VitalionWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.hr.ivanjuric.nutrilog]
  VitalionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/VitalionTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: hr.ivanjuric.nutrilog.tests
    dependencies:
      - target: Vitalion
schemes:
  Vitalion:
    build:
      targets:
        Vitalion: all
        VitalionTests: [test]
    test:
      targets: [VitalionTests]
      gatherCoverageData: true
