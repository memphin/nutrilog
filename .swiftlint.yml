included:
  - App
  - Packages
excluded:
  - "**/.build"
  - DerivedData
opt_in_rules:
  - empty_count
  - first_where
analyzer_rules:
  - unused_import
disabled_rules:
  - trailing_comma   # SwiftFormat owns comma style
  - sorted_imports   # SwiftFormat sorts imports (testable last)
line_length:
  warning: 140
  error: 200
identifier_name:
  excluded: [id, db, ml, kg, g, p, c, f]
type_body_length:
  warning: 400
file_length:
  warning: 600
