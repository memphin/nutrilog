name: Release status

# Keeps the pinned "Release status" issue up to date: which version is on the App Store, on TestFlight and on main.
# The table comes from tools/versions.py (docs/RELEASING.md).
on:
  schedule:
    - cron: "17 */6 * * *"  # catches App Store releases, review states, finished TestFlight processing, expiry
  workflow_run:
    workflows: [CI]
    types: [completed]  # after a push to main or a release tag (incl. the TestFlight upload)
  workflow_dispatch:

concurrency:
  group: release-status
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  update:
    name: Update the Release status issue
    runs-on: ubuntu-latest
    # CI also runs for pull requests; only main and release tags change the versions.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_branch == 'main' ||
      startsWith(github.event.workflow_run.head_branch, 'v')
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0  # tags and the commit count since the last one

      - name: Collect versions
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          {
            echo "<!-- release-status: generated by .github/workflows/release-status.yml, edits are overwritten -->"
            python3 tools/versions.py --markdown
            echo
            echo "_Updated $(date -u '+%Y-%m-%d %H:%M UTC') by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Run it now from **Actions → Release status → Run workflow**, or locally with \`python3 tools/versions.py\`._"
          } > status.md
          cat status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update the pinned issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create release-status --color 0E8A16 --description "Pinned release status, updated by a workflow" --force
          number=$(gh issue list --label release-status --state all --limit 1 --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            url=$(gh issue create --title "Release status" --label release-status --body-file status.md)
            number="${url##*/}"
          else
            gh issue reopen "$number" 2>/dev/null || true
            gh issue edit "$number" --body-file status.md
          fi
          gh issue pin "$number" 2>/dev/null || true  # already pinned, or 3 pins already used
