name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]  # a version tag also runs the TestFlight job (docs/RELEASING.md)
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # Run the gitleaks CLI directly: scans the whole history (gitleaks-action fails on a repo's first push,
      # where the first commit has no parent) and needs no third-party action or license.
      - name: Scan full history with gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks git --no-banner --redact -v .

  packages:
    name: Swift packages — build & test
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [Core, Persistence, FoodSources, FoodLookup, DesignSystem, Scanner, HealthKitClient]  # Scanner's camera UI and HealthKitClient's live HealthKit code are `#if os(iOS)` (built by the app job); their logic tests run here
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            Packages/${{ matrix.package }}/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ matrix.package }}-${{ hashFiles(format('Packages/{0}/Package.resolved', matrix.package)) }}
      - name: Test ${{ matrix.package }}
        working-directory: Packages/${{ matrix.package }}
        run: swift test --parallel --enable-code-coverage
      - name: Coverage
        working-directory: Packages/${{ matrix.package }}
        run: |
          JSON=$(swift test --show-codecov-path)
          PCT=$(jq '[.data[0].files[] | select(.filename | test("/Sources/"))] | (map(.summary.lines.covered) | add) * 100 / (map(.summary.lines.count) | add) | floor' "$JSON")
          echo "${{ matrix.package }} line coverage: ${PCT}%" | tee -a "$GITHUB_STEP_SUMMARY"
          # Core holds the nutrient/TDEE/date math: keep it ≥ 70 % (NFR-7, backlog #16).
          if [ "${{ matrix.package }}" = "Core" ] && [ "$PCT" -lt 70 ]; then
            echo "::error::Core coverage ${PCT}% is below 70%"
            exit 1
          fi

  app:
    name: iOS app — build & test (simulator)
    runs-on: macos-26
    needs: packages
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: xcodebuild -version
      - name: Create placeholder secrets
        run: cp Config/Secrets.xcconfig.template Config/Secrets.xcconfig
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Nutrilog.xcodeproj \
            -scheme Nutrilog \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult

  # Archives, signs (automatic, cloud-managed, via an App Store Connect API key: no certificates or profiles in the
  # repo) and uploads to TestFlight. Runs only for `v*` tags, after the tests passed. One-time setup and the secrets
  # it reads: docs/RELEASING.md.
  testflight:
    name: TestFlight upload
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    needs: [secrets-scan, app]
    concurrency:
      group: testflight
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
      OFF_USER_AGENT_CONTACT: ${{ secrets.OFF_USER_AGENT_CONTACT }}
    steps:
      - name: Check secrets
        run: |
          missing=()
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=TestFlight secrets missing::Add these repository secrets (Settings > Secrets and variables > Actions): ${missing[*]}. See docs/RELEASING.md."
            exit 1
          fi
          if [ -z "$USDA_FDC_API_KEY" ]; then
            echo "::warning::USDA_FDC_API_KEY is not set: this build has no built-in USDA key (users can still paste one in Settings)."
          fi
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }  # full history for the build number
      - name: Version from tag
        id: version
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH (e.g. v0.2.0)"
            exit 1
          fi
          VERSION="${TAG#v}"
          # Commits in the tagged history: grows with every release and stays the same when the job is re-run.
          BUILD=$(git rev-list --count HEAD)
          PROJECT_VERSION=$(awk -F'"' '/^ *MARKETING_VERSION:/ { print $2; exit }' project.yml)
          if [ "$PROJECT_VERSION" != "$VERSION" ]; then
            echo "::warning::project.yml MARKETING_VERSION is $PROJECT_VERSION but the tag is $TAG. The tag wins; bump project.yml so local builds match."
          fi
          echo "Nutrilog $VERSION (build $BUILD)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - name: Show toolchain
        run: xcodebuild -version
      - name: Write build secrets, API key and export options
        run: |
          # Secrets.xcconfig is git-ignored: the template's defaults, then this build's values (later lines win).
          cp Config/Secrets.xcconfig.template Config/Secrets.xcconfig
          {
            echo "USDA_FDC_API_KEY = $USDA_FDC_API_KEY"
            if [ -n "$OFF_USER_AGENT_CONTACT" ]; then echo "OFF_USER_AGENT_CONTACT = $OFF_USER_AGENT_CONTACT"; fi
            echo "DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
          } >> Config/Secrets.xcconfig

          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          if ! printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY_PATH" 2>/dev/null || ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::ASC_KEY_P8 must be the base64 of the AuthKey_<KEY_ID>.p8 file. See docs/RELEASING.md."
            exit 1
          fi
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

          # The committed template has no team ID; add it to a copy.
          cp Config/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
      - name: Archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Nutrilog.xcodeproj \
            -scheme Nutrilog \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Nutrilog.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            -quiet
      - name: Export and upload to TestFlight
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -o pipefail
          # destination=upload in the export options: the export signs for App Store Connect and uploads the build.
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Nutrilog.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded Nutrilog $VERSION ($BUILD) to App Store Connect; it shows up in TestFlight after processing." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the API key and build secrets
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8 Config/Secrets.xcconfig
