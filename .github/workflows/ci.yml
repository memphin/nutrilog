name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]  # a version tag also runs the TestFlight job (docs/RELEASING.md)
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # Run the gitleaks CLI directly: scans the whole history (gitleaks-action fails on a repo's first push,
      # where the first commit has no parent) and needs no third-party action or license.
      - name: Scan full history with gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks git --no-banner --redact -v .

  packages:
    name: Swift packages — build & test (${{ matrix.group.name }})
    runs-on: macos-26
    # Two jobs, not one per package: a run then takes 3 macOS runners instead of 8, so runs no longer wait for each
    # other's runners (the repo gets 5 macOS runners at a time). The packages that build GRDB go together.
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: GRDB
            packages: Persistence FoodLookup
          - name: other
            packages: Core FoodSources DesignSystem Scanner HealthKitClient  # Scanner's camera UI and HealthKitClient's live HealthKit code are `#if os(iOS)` (built by the app job); their logic tests run here
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        id: toolchain
        run: |
          xcodebuild -version && swift --version
          echo "xcode=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            Packages/*/.build
            ~/Library/Caches/org.swift.swiftpm
          # The repo name is in the key because .build holds absolute paths: a cache from a checkout under another
          # name (the repo was renamed from nutrilog) fails with "missing required module 'SwiftShims'".
          # The source hash makes every change save a fresh cache; restore-keys start from the latest one.
          key: spm-${{ github.event.repository.name }}-${{ steps.toolchain.outputs.xcode }}-${{ matrix.group.name }}-${{ hashFiles('Packages/**/*.swift', 'Packages/**/Package.resolved') }}
          restore-keys: spm-${{ github.event.repository.name }}-${{ steps.toolchain.outputs.xcode }}-${{ matrix.group.name }}-
      - name: Test ${{ matrix.group.packages }}
        run: |
          failed=()
          for package in ${{ matrix.group.packages }}; do
            echo "::group::$package"
            if ! (cd "Packages/$package" && swift test --parallel --enable-code-coverage); then
              failed+=("$package")
              echo "::error::$package tests failed"
              echo "::endgroup::"
              continue
            fi
            JSON=$(cd "Packages/$package" && swift test --show-codecov-path)
            PCT=$(jq '[.data[0].files[] | select(.filename | test("/Sources/"))] | (map(.summary.lines.covered) | add) * 100 / (map(.summary.lines.count) | add) | floor' "$JSON")
            echo "$package line coverage: ${PCT}%" | tee -a "$GITHUB_STEP_SUMMARY"
            # Core holds the nutrient/TDEE/date math: keep it ≥ 70 % (NFR-7, backlog #16).
            if [ "$package" = "Core" ] && [ "$PCT" -lt 70 ]; then
              echo "::error::Core coverage ${PCT}% is below 70%"
              failed+=("Core coverage")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failed: ${failed[*]}"
            exit 1
          fi

  app:
    name: iOS app — build & test (simulator)
    runs-on: macos-26
    # No `needs: packages`: runs alongside the package jobs instead of waiting for them.
    env:
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
      # Xcode's compilation cache: compiler outputs keyed by the content of their inputs, so (unlike a cached
      # DerivedData, which goes stale because a checkout gives every file a new mtime) it is reused after a fresh
      # checkout and only what changed is compiled again. Saved after every run, restored from the newest one.
      XCODE_CAS: ${{ github.workspace }}/.ci-cache/xcode-cas
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        id: toolchain
        run: |
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
      - name: Create placeholder secrets
        run: cp Config/Secrets.xcconfig.template Config/Secrets.xcconfig
      - name: Restore compilation cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.XCODE_CAS }}
          key: xcode-cas-${{ steps.toolchain.outputs.xcode }}-${{ github.sha }}
          restore-keys: xcode-cas-${{ steps.toolchain.outputs.xcode }}-
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # Not booted here but by the test step, after the build: on the runner's 3 cores a booting simulator slows the
          # compiler more than the boot takes on its own (measured in #93).
      - name: Build for testing
        run: |
          set -o pipefail
          # COMPILER_INDEX_STORE_ENABLE=NO: CI never uses the index Xcode otherwise writes while compiling.
          xcodebuild build-for-testing \
            -project Vitalion.xcodeproj \
            -scheme Vitalion \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }},arch=arm64" \
            -derivedDataPath "$DERIVED_DATA" \
            -enableCodeCoverage NO \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="$XCODE_CAS" \
            COMPILATION_CACHE_LIMIT_SIZE=2G \
            -quiet
          du -sh "$XCODE_CAS" || true
      - name: Save compilation cache
        if: always() && steps.toolchain.outputs.xcode != ''
        uses: actions/cache/save@v5
        with:
          path: ${{ env.XCODE_CAS }}
          key: xcode-cas-${{ steps.toolchain.outputs.xcode }}-${{ github.sha }}
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Vitalion.xcodeproj \
            -scheme Vitalion \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }},arch=arm64" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage NO \
            -quiet
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
      # Without this the runner spends 20–50 s killing the simulator's leftover processes one by one.
      - name: Shut down the simulator
        if: always()
        run: xcrun simctl shutdown all || true

  # Archives, signs (automatic, cloud-managed, via an App Store Connect API key: no certificates or profiles in the
  # repo) and uploads to TestFlight. Runs only for `v*` tags, after the tests passed. One-time setup and the secrets
  # it reads: docs/RELEASING.md.
  testflight:
    name: TestFlight upload
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    needs: [secrets-scan, packages, app]
    concurrency:
      group: testflight
      cancel-in-progress: false
    # Secrets are passed per step, only to the steps that need them.
    steps:
      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
        run: |
          missing=()
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=TestFlight secrets missing::Add these repository secrets (Settings > Secrets and variables > Actions): ${missing[*]}. See docs/RELEASING.md."
            exit 1
          fi
          if [ -z "$USDA_FDC_API_KEY" ]; then
            echo "::warning::USDA_FDC_API_KEY is not set: this build has no built-in USDA key (users can still paste one in Settings)."
          fi
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }  # full history for the build number
      - name: Version from tag
        id: version
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH (e.g. v0.2.0)"
            exit 1
          fi
          VERSION="${TAG#v}"
          # Commits in the tagged history: grows with every release and stays the same when the job is re-run.
          BUILD=$(git rev-list --count HEAD)
          PROJECT_VERSION=$(awk -F'"' '/^ *MARKETING_VERSION:/ { print $2; exit }' project.yml)
          if [ "$PROJECT_VERSION" != "$VERSION" ]; then
            echo "::warning::project.yml MARKETING_VERSION is $PROJECT_VERSION but the tag is $TAG. The tag wins; bump project.yml so local builds match."
          fi
          echo "Vitalion $VERSION (build $BUILD)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - name: Show toolchain
        run: xcodebuild -version
      - name: Write build secrets, API key and export options
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
          OFF_USER_AGENT_CONTACT: ${{ secrets.OFF_USER_AGENT_CONTACT }}
        run: |
          umask 077  # the key file and the xcconfig are readable by this user only
          # Secrets.xcconfig is git-ignored: the template's defaults, then this build's values (later lines win).
          cp Config/Secrets.xcconfig.template Config/Secrets.xcconfig
          {
            echo "USDA_FDC_API_KEY = $USDA_FDC_API_KEY"
            if [ -n "$OFF_USER_AGENT_CONTACT" ]; then echo "OFF_USER_AGENT_CONTACT = $OFF_USER_AGENT_CONTACT"; fi
            echo "DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
          } >> Config/Secrets.xcconfig

          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          if ! printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY_PATH" 2>/dev/null || ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::ASC_KEY_P8 must be the base64 of the AuthKey_<KEY_ID>.p8 file. See docs/RELEASING.md."
            exit 1
          fi
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

          # The committed template has no team ID; add it to a copy.
          cp Config/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Vitalion.xcodeproj \
            -scheme Vitalion \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Vitalion.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            -quiet
      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -o pipefail
          # destination=upload in the export options: the export signs for App Store Connect and uploads the build.
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Vitalion.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded Vitalion $VERSION ($BUILD) to App Store Connect; it shows up in TestFlight after processing." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the API key and build secrets
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8 Config/Secrets.xcconfig
